name: Swift Tests

# Prevent duplicate builds when a PR is created from a branch in the same repo
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Swift ${{ matrix.swift }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 'system' uses the Xcode toolchain preinstalled on macos-latest,
        # so breakage on current compilers surfaces even while the pinned
        # version keeps validating the minimum supported toolchain.
        # The pinned toolchain must run on an older image: Swift 6.0.2
        # cannot compile against the newer SDKs of current Xcode.
        include:
          - swift: '6.0.2'
            runner: macos-14
          - swift: 'system'
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Swift
        if: matrix.swift != 'system'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}
      
      - name: Build
        run: swift build -v
      
      - name: Run tests
        run: swift test -v
      
      - name: Run tests (release)
        run: swift test -c release -v

  ubuntu:
    name: Ubuntu (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 'latest' tracks the newest stable Swift release image.
        swift: ['6.0.2', 'latest']
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: swift build -v
      
      - name: Run tests
        run: swift test --parallel
      
      - name: Run tests (release)
        run: swift test -c release --parallel 